# Un computador de prueba en localhost. No crea nada en Fly y no cobra.
name: iabot-desktop

services:
  desktop:
    build:
      context: ../..
      dockerfile: infra/desktop/Dockerfile
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:8787:8787"
    environment:
      XAI_MODE: ${XAI_MODE:-mock}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_API_URL: ${XAI_API_URL:-https://api.x.ai/v1}
      XAI_COMPUTER_MODEL: ${XAI_COMPUTER_MODEL:-grok-4.3}
      DISPLAY: ":99"
      CHROME_PROFILE: /data/chrome-profile
      AGENT_BIND: 0.0.0.0
      AGENT_PORT: "8787"
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:-local}
      MACHINE_ID: ${MACHINE_ID:-desktop-local}
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "800"
    volumes:
      - chrome_profile:/data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/status',{headers:{authorization:'Bearer '+process.env.AGENT_RUNTIME_TOKEN}}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  chrome_profile:
