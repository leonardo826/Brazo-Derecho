server {
  listen 80;
  server_name MACHINE_AGENT_DOMAIN;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 404;
  }
}

server {
  listen 443 ssl;
  server_name MACHINE_AGENT_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/MACHINE_AGENT_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/MACHINE_AGENT_DOMAIN/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
