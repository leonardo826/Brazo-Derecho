server {
  listen 443 ssl;
  server_name MACHINE_AGENT_DOMAIN;

  ssl_certificate /etc/iabot-machine-agent/tls/fullchain.pem;
  ssl_certificate_key /etc/iabot-machine-agent/tls/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
