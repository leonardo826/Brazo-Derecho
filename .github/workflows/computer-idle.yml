name: Apagar computadores quietos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reap:
    # El cron cada 5 minutos no corre hasta que la variable valga exactamente true.
    # Un disparo manual sí corre, y falla si falta el secret.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.COMPUTER_IDLE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir el apagado
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "Falta CRON_SECRET. No llamo al cron."
            exit 1
          fi
          base="${APP_URL:-https://brazo-derecho.vercel.app}"
          base="${base%/}"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/cron/computer-idle"
