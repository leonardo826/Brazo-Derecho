name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brazo
          POSTGRES_PASSWORD: brazo
          POSTGRES_DB: brazo_derecho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brazo -d brazo_derecho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brazo:brazo@localhost:5432/brazo_derecho
      DIRECT_URL: postgresql://brazo:brazo@localhost:5432/brazo_derecho
      SESSION_SECRET: ci-session-secret-de-al-menos-32-chars
      XAI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
