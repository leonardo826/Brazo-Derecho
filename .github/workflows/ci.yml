name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://brazo:brazo@localhost:5432/brazo_derecho
      DIRECT_URL: postgresql://brazo:brazo@localhost:5432/brazo_derecho
      SESSION_SECRET: ci-session-secret-de-al-menos-32-chars
      XAI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
